<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 728" width="1290" height="728" role="img"><defs><marker id="arrow-0078D4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0078D4"/></marker><marker id="arrow-8764B8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8764B8"/></marker><marker id="arrow-C50F1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C50F1F"/></marker></defs><rect width="1290" height="728" fill="#FFFFFF"/><path d="M 150 180 L 150 666" stroke="#8A8886" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/><path d="M 480 180 L 480 666" stroke="#8A8886" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/><path d="M 810 180 L 810 666" stroke="#8A8886" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/><path d="M 1140 180 L 1140 666" stroke="#8A8886" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/><path d="M 154 200 L 476 200" fill="none" stroke="#0078D4" stroke-width="2.0" marker-end="url(#arrow-0078D4)" stroke-linejoin="round"/><path d="M 484 264 L 806 264" fill="none" stroke="#0078D4" stroke-width="2.0" marker-end="url(#arrow-0078D4)" stroke-linejoin="round"/><path d="M 810 318 L 856 318 L 856 344 L 814 344" fill="none" stroke="#0078D4" stroke-width="2" marker-end="url(#arrow-0078D4)"/><path d="M 806 392 L 484 392" fill="none" stroke="#8764B8" stroke-width="2.0" stroke-dasharray="6 3" marker-end="url(#arrow-8764B8)" stroke-linejoin="round"/><path d="M 484 456 L 1136 456" fill="none" stroke="#0078D4" stroke-width="2.0" marker-end="url(#arrow-0078D4)" stroke-linejoin="round"/><path d="M 1140 510 L 1094 510 L 1094 536 L 1136 536" fill="none" stroke="#C50F1F" stroke-width="2" marker-end="url(#arrow-C50F1F)"/><path d="M 1136 584 L 484 584" fill="none" stroke="#8764B8" stroke-width="2.0" stroke-dasharray="6 3" marker-end="url(#arrow-8764B8)" stroke-linejoin="round"/><text x="24" y="38" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#201F1E" font-weight="600" text-anchor="start">Delegated access: reading Graph and SQL as the user (on-behalf-of)</text><text x="24" y="62" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#605E5C" font-weight="400" text-anchor="start">The API holds no standing access to the user&#x27;s data  ·  Last updated 2026-11-12</text><image href="data:image/svg+xml;base64," x="130.0" y="88.0" width="40" height="40"/><text x="150" y="144.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="600" text-anchor="middle">API Management</text><text x="150" y="159.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#605E5C" font-weight="400" text-anchor="middle">forwards the user&#x27;s token</text><image href="data:image/svg+xml;base64," x="460.0" y="88.0" width="40" height="40"/><text x="480" y="144.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="600" text-anchor="middle">Backend API</text><text x="480" y="159.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#605E5C" font-weight="400" text-anchor="middle">confidential client</text><image href="data:image/svg+xml;base64," x="790.0" y="88.0" width="40" height="40"/><text x="810" y="144.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="600" text-anchor="middle">Microsoft Entra ID</text><rect x="1065.0" y="85.0" width="150" height="46" rx="4" fill="#FFFFFF" stroke="#605E5C" stroke-width="1.2"/><text x="1140" y="104.25" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="600" text-anchor="middle">Graph or Azure SQL</text><text x="1140" y="119.75" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#605E5C" font-weight="400" text-anchor="middle">applies the user&#x27;s rights</text><rect x="168.70000000000002" y="180" width="288.59999999999997" height="18" rx="3" fill="#FFFFFF" fill-opacity="0.92"/><text x="315.0" y="192" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#201F1E" text-anchor="middle">Request with the user&#x27;s token (aud = this API)</text><circle cx="172" cy="200" r="11" fill="#0078D4" stroke="#FFFFFF" stroke-width="2"/><text x="172" y="204.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><rect x="486.5" y="244" width="313.0" height="18" rx="3" fill="#FFFFFF" fill-opacity="0.92"/><text x="645.0" y="256" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#201F1E" text-anchor="middle">Exchange the user&#x27;s token for a Graph or SQL token</text><rect x="422.45000000000005" y="270" width="441.09999999999997" height="18" rx="3" fill="#FFFFFF" fill-opacity="0.92"/><text x="645.0" y="282" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#605E5C" text-anchor="middle">proves itself with a managed identity (a client secret is the fallback)</text><circle cx="502" cy="264" r="11" fill="#0078D4" stroke="#FFFFFF" stroke-width="2"/><text x="502" y="268.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><rect x="864" y="318" width="172.7" height="32" rx="3" fill="#FFFFFF" fill-opacity="0.92"/><text x="866" y="330" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#201F1E" text-anchor="start">Is this API allowed to ask?</text><text x="866" y="344" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#201F1E" text-anchor="start">Was admin consent granted?</text><circle cx="788" cy="330" r="11" fill="#0078D4" stroke="#FFFFFF" stroke-width="2"/><text x="788" y="334.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><rect x="495.65" y="372" width="294.7" height="18" rx="3" fill="#FFFFFF" fill-opacity="0.92"/><text x="645.0" y="384" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#201F1E" text-anchor="middle">New token for Graph or SQL; still the same user</text><circle cx="502" cy="392" r="11" fill="#8764B8" stroke="#FFFFFF" stroke-width="2"/><text x="502" y="396.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><rect x="733.85" y="436" width="148.29999999999998" height="18" rx="3" fill="#FFFFFF" fill-opacity="0.92"/><text x="810.0" y="448" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#201F1E" text-anchor="middle">Call with the new token</text><circle cx="502" cy="456" r="11" fill="#0078D4" stroke="#FFFFFF" stroke-width="2"/><text x="502" y="460.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><rect x="884.9" y="510" width="197.1" height="32" rx="3" fill="#FFFFFF" fill-opacity="0.92"/><text x="1084" y="522" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#201F1E" text-anchor="end">Authorises the user: directory</text><text x="1084" y="536" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#201F1E" text-anchor="end">profile, or a SQL database user</text><circle cx="1162" cy="522" r="11" fill="#C50F1F" stroke="#FFFFFF" stroke-width="2"/><text x="1162" y="526.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><rect x="721.65" y="564" width="172.7" height="18" rx="3" fill="#FFFFFF" fill-opacity="0.92"/><text x="810.0" y="576" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#201F1E" text-anchor="middle">Only what that user may see</text><circle cx="502" cy="584" r="11" fill="#8764B8" stroke="#FFFFFF" stroke-width="2"/><text x="502" y="588.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><text x="24" y="704" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#605E5C" font-weight="400" text-anchor="start">Someone outside Contoso Finance Readers has no database user, so finance_query_spend is refused, whichever agent they use.</text></svg>