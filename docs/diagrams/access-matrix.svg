<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 720" width="1300" height="720" role="img"><defs></defs><rect width="1300" height="720" fill="#FFFFFF"/><rect x="330" y="150" width="420" height="215" rx="6" fill="#FFFFFF" stroke="#8A8886" stroke-width="1.0"/><text x="340" y="172" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#201F1E" font-weight="600" text-anchor="start">Delegated, client secret</text><rect x="770" y="150" width="420" height="215" rx="6" fill="#FFFFFF" stroke="#8A8886" stroke-width="1.0"/><image href="data:image/svg+xml;base64," x="778" y="157" width="20" height="20"/><text x="804" y="172" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#201F1E" font-weight="600" text-anchor="start">Delegated, managed identity</text><rect x="330" y="400" width="420" height="215" rx="6" fill="#FFFFFF" stroke="#8A8886" stroke-width="1.0"/><text x="340" y="422" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#201F1E" font-weight="600" text-anchor="start">App-only, client secret</text><rect x="770" y="400" width="420" height="215" rx="6" fill="#FFFFFF" stroke="#8A8886" stroke-width="1.0"/><image href="data:image/svg+xml;base64," x="778" y="407" width="20" height="20"/><text x="804" y="422" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#201F1E" font-weight="600" text-anchor="start">App-only, managed identity</text><rect x="24" y="640" width="1252" height="56" rx="6" fill="#FFFFFF" stroke="#8A8886" stroke-width="1.0"/><text x="34" y="662" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#201F1E" font-weight="600" text-anchor="start"></text><text x="24" y="38" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#201F1E" font-weight="600" text-anchor="start">Access model and credential are separate choices</text><text x="24" y="62" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#605E5C" font-weight="400" text-anchor="start">A managed identity changes how the backend proves who it is, not whose permissions apply  ·  Last updated 2026-11-12</text><text x="540" y="112" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#0078D4" font-weight="600" text-anchor="middle">Client secret</text><text x="540" y="132.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#605E5C" font-weight="400" text-anchor="middle">A password to store and rotate</text><text x="980" y="112" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#0078D4" font-weight="600" text-anchor="middle">Managed identity</text><text x="980" y="132.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#605E5C" font-weight="400" text-anchor="middle">No secret: trusted through a federated credential</text><text x="30" y="184" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#201F1E" font-weight="600" text-anchor="start">Delegated access</text><text x="30" y="206" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#605E5C" font-weight="400" text-anchor="start">The backend acts as</text><text x="30" y="221" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#605E5C" font-weight="400" text-anchor="start">the signed-in user</text><text x="30" y="250" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#201F1E" font-weight="600" text-anchor="start">Source system</text><text x="30" y="265" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#201F1E" font-weight="600" text-anchor="start">sees the user</text><text x="30" y="434" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#201F1E" font-weight="600" text-anchor="start">App-only access</text><text x="30" y="456" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#605E5C" font-weight="400" text-anchor="start">The backend acts as</text><text x="30" y="471" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#605E5C" font-weight="400" text-anchor="start">the application</text><text x="30" y="500" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#201F1E" font-weight="600" text-anchor="start">Source system</text><text x="30" y="515" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#201F1E" font-weight="600" text-anchor="start">sees the app</text><text x="346" y="216.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="400" text-anchor="start">On-behalf-of exchange.</text><text x="346" y="235.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="400" text-anchor="start">The API presents a client secret to</text><text x="346" y="254.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="400" text-anchor="start">Entra ID with the user&#x27;s token.</text><text x="346" y="273.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="400" text-anchor="start">Works, but the secret is a liability.</text><rect x="346.0" y="322" width="150" height="26" rx="13" fill="#EFF6FC" stroke="#0078D4" stroke-width="1.2"/><text x="421.0" y="339.5" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" fill="#201F1E" text-anchor="middle">built and tested</text><text x="786" y="216.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="400" text-anchor="start">The same exchange. The user-assigned</text><text x="786" y="235.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="400" text-anchor="start">managed identity supplies the client</text><text x="786" y="254.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="400" text-anchor="start">assertion in place of the secret.</text><text x="786" y="273.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="400" text-anchor="start">The default here.</text><rect x="786.0" y="322" width="150" height="26" rx="13" fill="#EFF6FC" stroke="#498205" stroke-width="1.2"/><text x="861.0" y="339.5" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" fill="#201F1E" text-anchor="middle">built and tested</text><text x="346" y="466.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="400" text-anchor="start">Client credentials flow with a secret.</text><text x="346" y="485.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="400" text-anchor="start">A broad identity and a secret to rotate.</text><text x="346" y="504.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="400" text-anchor="start"></text><text x="346" y="523.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="400" text-anchor="start">Avoid: use a managed identity instead.</text><rect x="346.0" y="572" width="90" height="26" rx="13" fill="#EFF6FC" stroke="#C50F1F" stroke-width="1.2"/><text x="391.0" y="589.5" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" fill="#201F1E" text-anchor="middle">avoid</text><text x="786" y="466.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="400" text-anchor="start">The managed identity gets its own token</text><text x="786" y="485.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="400" text-anchor="start">for the source system. No user token.</text><text x="786" y="504.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="400" text-anchor="start">Needs a database user or app role for</text><text x="786" y="523.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="400" text-anchor="start">that identity, scoped narrowly.</text><rect x="786.0" y="572" width="350" height="26" rx="13" fill="#EFF6FC" stroke="#498205" stroke-width="1.2"/><text x="961.0" y="589.5" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" fill="#201F1E" text-anchor="middle">for data users cannot reach; built and tested</text><text x="44" y="674" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#201F1E" font-weight="600" text-anchor="start">Pick the row by asking whose permissions should apply. Pick the column by asking how the backend should prove itself.</text></svg>