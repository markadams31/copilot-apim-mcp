<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" width="1400" height="520" role="img"><defs></defs><rect width="1400" height="520" fill="#FFFFFF"/><rect x="50" y="170" width="220" height="260" rx="6" fill="#FFFFFF" stroke="#8A8886" stroke-width="1.0"/><text x="60" y="192" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#201F1E" font-weight="600" text-anchor="start">Security</text><rect x="310" y="170" width="220" height="260" rx="6" fill="#FFFFFF" stroke="#8A8886" stroke-width="1.0"/><text x="320" y="192" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#201F1E" font-weight="600" text-anchor="start">Governance</text><rect x="570" y="170" width="220" height="260" rx="6" fill="#FFFFFF" stroke="#8A8886" stroke-width="1.0"/><text x="580" y="192" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#201F1E" font-weight="600" text-anchor="start">Observability</text><rect x="830" y="170" width="220" height="260" rx="6" fill="#FFFFFF" stroke="#8A8886" stroke-width="1.0"/><text x="840" y="192" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#201F1E" font-weight="600" text-anchor="start">AI safety</text><rect x="1090" y="170" width="220" height="260" rx="6" fill="#FFFFFF" stroke="#8A8886" stroke-width="1.0"/><text x="1100" y="192" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#201F1E" font-weight="600" text-anchor="start">Evals</text><rect x="80" y="132" width="1240" height="8" rx="2" fill="#498205" opacity="0.85"/><text x="24" y="38" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#201F1E" font-weight="600" text-anchor="start">Five assurance pillars before an agent proceeds</text><text x="24" y="62" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#605E5C" font-weight="400" text-anchor="start">Gateway tests prove the front door; evals prove the agent  ·  Last updated 2026-11-12</text><text x="700" y="118" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#201F1E" font-weight="600" text-anchor="middle">Assurance to proceed</text><text x="160" y="230.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="400" text-anchor="middle">Contain blast radius:</text><text x="160" y="245.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="400" text-anchor="middle">allow-lists, private path,</text><text x="160" y="261.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="400" text-anchor="middle">no secrets on agents</text><rect x="110.0" y="377" width="100" height="26" rx="13" fill="#EFF6FC" stroke="#498205" stroke-width="1.2"/><text x="160" y="394.5" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" fill="#201F1E" text-anchor="middle">required</text><text x="420" y="230.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="400" text-anchor="middle">Who grants tools,</text><text x="420" y="245.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="400" text-anchor="middle">who stops an agent,</text><text x="420" y="261.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="400" text-anchor="middle">data policy allow-list</text><rect x="370.0" y="377" width="100" height="26" rx="13" fill="#EFF6FC" stroke="#498205" stroke-width="1.2"/><text x="420" y="394.5" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" fill="#201F1E" text-anchor="middle">required</text><text x="680" y="230.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="400" text-anchor="middle">Who called what,</text><text x="680" y="245.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="400" text-anchor="middle">for whom; denials</text><text x="680" y="261.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="400" text-anchor="middle">and silent absence</text><rect x="630.0" y="377" width="100" height="26" rx="13" fill="#EFF6FC" stroke="#498205" stroke-width="1.2"/><text x="680" y="394.5" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" fill="#201F1E" text-anchor="middle">required</text><text x="940" y="230.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="400" text-anchor="middle">Injection, silent</text><text x="940" y="245.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="400" text-anchor="middle">failure, write HITL;</text><text x="940" y="261.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="400" text-anchor="middle">probes 1–9</text><rect x="890.0" y="377" width="100" height="26" rx="13" fill="#EFF6FC" stroke="#498205" stroke-width="1.2"/><text x="940" y="394.5" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" fill="#201F1E" text-anchor="middle">required</text><text x="1200" y="230.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="400" text-anchor="middle">Tool choice,</text><text x="1200" y="245.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="400" text-anchor="middle">faithfulness, honesty;</text><text x="1200" y="261.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#201F1E" font-weight="400" text-anchor="middle">Evaluate + scorecard</text><rect x="1150.0" y="377" width="100" height="26" rx="13" fill="#EFF6FC" stroke="#498205" stroke-width="1.2"/><text x="1200" y="394.5" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" fill="#201F1E" text-anchor="middle">required</text><text x="700" y="470" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#605E5C" font-weight="400" text-anchor="middle">All five must be green enough for Contoso&#x27;s proceed decision — not just security.</text></svg>